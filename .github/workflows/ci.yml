name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The shared conformance corpus, pinned to a commit. Without it every vector in
      # ConformanceSuiteTest and SidecarSchemasTest aborts via Assumptions -- which reads green,
      # so CI reported success while measuring this implementation against none of the corpus.
      - name: Fetch references
        run: ./scripts/fetch-references.sh

      # `build` reaches javadoc now: every module publishes a javadoc jar, so `assemble` runs the
      # doclint pass that used to need a step of its own here.
      - name: Build and test
        # An absent corpus is a skip locally and a failure here, so a green CI run means the
        # conformance vectors actually ran rather than quietly aborting.
        env:
          TSON_REQUIRE_TEST_SUITE: "1"
        run: ./gradlew build

      # The publication itself, which nothing else exercises -- a POM or component wired wrong is
      # otherwise invisible until someone tries to depend on the artifact.
      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal
