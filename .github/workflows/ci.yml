name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` reaches javadoc now: every module publishes a javadoc jar, so `assemble` runs the
      # doclint pass that used to need a step of its own here.
      - name: Build and test
        run: ./gradlew build

      # The publication itself, which nothing else exercises -- a POM or component wired wrong is
      # otherwise invisible until someone tries to depend on the artifact.
      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal
